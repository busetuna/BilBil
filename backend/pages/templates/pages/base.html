<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BilBil{% endblock %}</title>
  <style>
    :root { --primary: #7C4DFF; --bg: #F5F0FF; --text: #2D3142; --muted: #6B6F80; --card: #fff; --danger: #E53935; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--primary); color: #fff; padding: 20px 16px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 22px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
    h2 { font-size: 19px; margin: 28px 0 8px; }
    p, li { color: var(--text); }
    .muted { color: var(--muted); font-size: 14px; }
    a { color: var(--primary); }
    ul { padding-left: 22px; }
    footer { text-align: center; padding: 24px 16px; font-size: 14px; color: var(--muted); }
    footer a { margin: 0 8px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="/">🐦 BilBil</a></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <a href="/gizlilik">Gizlilik Politikası</a>
    <a href="/hesap-sil">Hesap Silme</a>
    <a href="mailto:{{ contact_email }}">İletişim</a>
  </footer>
</body>
</html>
