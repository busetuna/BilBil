name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4

  # Bilbil API (backend/, Railway)
  http: ^1.2.0


  # AI Services
  flutter_tts: ^3.8.0
  speech_to_text: ^7.0.0
  vosk_flutter: ^0.3.0+1
  record: ^5.0.0
  archive: ^3.4.0

  # UI & Charts
  fl_chart: ^0.68.0

  # Ads
  google_mobile_ads: ^5.1.0

  # Utils
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  google_fonts: ^6.1.0

dependency_overrides:
  permission_handler: ^11.2.0
  http: ^1.2.0
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/kolay/
    - assets/images/orta/
    - assets/images/zor/
    - bilbil-puzzle/