name: app
description: "BilBil: 2-5 yaş için sesli kelime öğrenme uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4

  # Bilbil API (backend/, Railway)
  http: ^1.2.0
  # Gizlilik politikası bağlantısı (Google Play uygulama içinde de istiyor)
  url_launcher: ^6.3.1

  # Ebeveyn PIN'inin özeti
  crypto: ^3.0.7


  # AI Services
  flutter_tts: ^3.8.0
  speech_to_text: ^7.0.0
  vosk_flutter: ^0.3.0+1
  record: ^5.0.0
  archive: ^3.4.0

  # UI & Charts
  fl_chart: ^0.68.0

  # Ads
  google_mobile_ads: ^5.1.0

  # Utils
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  google_fonts: ^6.1.0
  audioplayers: ^6.8.1

dependency_overrides:
  permission_handler: ^11.2.0
  http: ^1.2.0
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Uygulama ikonu (Kral Bilbil'in yüzü): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/bilbil_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/bilbil_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/kolay/
    - assets/images/orta/
    - assets/images/zor/
    - assets/sounds/feedback/
    - assets/sounds/backgrounds/
    - assets/voice/
    - assets/voice/clips/
    - bilbil-puzzle/